[package]
name = "purrdf-hooks"
version = "3.0.1"
edition = "2024"
description = "Declarative RDF-described, SPARQL-driven knowledge derivation hooks (kh:) for PurRDF"
license = "MIT OR Apache-2.0"
repository = "https://github.com/seanchatmangpt/purrdf"

[dependencies]
purrdf-core = { path = "../rdf-core", version = "3.0.1" }
purrdf-rdf = { path = "../rdf", version = "3.0.1" }
purrdf-shapes = { path = "../shapes", version = "3.0.1" }
purrdf-sparql-eval = { path = "../sparql-eval", version = "3.0.1" }
purrdf-sql = { path = "../sql", version = "3.0.1" }
purrdf-duckdb = { path = "../duckdb", version = "3.0.1" }
blake3 = "1.5"
thiserror = "2.0"

[dev-dependencies]
cucumber = { version = "0.21", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[test]]
name = "cucumber_hooks"
harness = false

[lints]
workspace = true
