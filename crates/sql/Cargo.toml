[package]
name = "purrdf-sql"
description = "PurRDF declarative SQL-in-RDF AST representation, validation and deterministic compiler"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["sql", "rdf", "ast", "compiler", "relational"]
categories = ["compilers", "data-structures"]

[lints]
workspace = true

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
purrdf-core = { workspace = true }
purrdf-hash = { workspace = true }
purrdf-iri = { workspace = true }
purrdf-lex = { workspace = true }
purrdf-rdf = { workspace = true }
purrdf-shapes = { workspace = true }

[dev-dependencies]
purrdf-testkit = { workspace = true }

# Charter-A04 admission hot path (cold compile vs memo hit over seeded wide
# projections). Report-only; `make bench` lane.
[[bench]]
name = "compile_query"
harness = false
