[package]
name = "purrdf-duckdb"
description = "PurRDF embedded DuckDB execution engine, virtual Parquet views and relational-to-RDF row projection"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["duckdb", "relational", "parquet", "rdf", "views"]
categories = ["database-implementations"]

[lib]
crate-type = ["rlib"]
path = "src/lib.rs"

[dependencies]
frozen-duckdb = { workspace = true }
purrdf-columnar = { workspace = true }
purrdf-core = { workspace = true }
purrdf-hash = { workspace = true }
purrdf-rdf = { workspace = true }
purrdf-sql = { workspace = true }
purrdf-xsd = { workspace = true }

[dev-dependencies]
purrdf-arrow = { workspace = true }
purrdf-testkit = { workspace = true }

[[bench]]
name = "sieve_bench"
harness = false

[[bench]]
name = "sql_rdf_e2e"
harness = false

[lints]
workspace = true
