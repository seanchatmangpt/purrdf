#
# The native bench-harness + Python-compat benchmark suites, OFF the per-push path.
#
# These run ~90-120 minutes, off the per-push path: a bench never gates a merge
# (nothing on a pull request triggers this workflow), and PurRDF asserts no
# speedups (docs/BENCHMARKS.md). Run per push, that bought a two-hour runner per
# commit for a result nothing reads — and GitHub auto-cancelled a ~2 h run
# outright, so the data was not even collected. A weekly run on an uncontended
# runner is strictly better DATA than a per-push run competing with the gating
# jobs for the same machine, which is the second reason this moved rather than
# merely being deleted.
#
# Fail-closed within the run: no `continue-on-error` anywhere. A red bench run
# is data, and a red answer rendered as green answers nothing — the rule the
# dispatch-only comparison jobs below already state.
#
# `workflow_dispatch` is what makes it available on demand: a change that plausibly
# moves performance is benchmarked by running this workflow against the branch, not
# by waiting for the schedule.
name: Benchmarks

on:
  schedule:
    # Sundays 04:17 UTC. Off the hour, because scheduled workflows queue on shared
    # runners and the top of the hour is where everyone else's cron already is.
    - cron: "17 4 * * 0"
  workflow_dispatch:
    inputs:
      base_ref:
        description: >-
          Base commit for the x86_64 and aarch64 bench comparison. Empty means the
          merge-base of origin/main and the dispatched commit.
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # Read-only. `actions: write` was carried here from the per-push job and no step
    # uses it — checkout, the toolchain installs, the bench runs and
    # `upload-artifact` all work under `contents: read`. A scheduled workflow runs
    # with the repository token, so an unused write scope is a standing grant for
    # nothing.
    permissions:
      contents: read
    env:
      # Where purrdf_testkit::bench writes each benchmark's estimates.json, named
      # explicitly so the artifact upload below reads the same directory.
      PURRDF_BENCH_HOME: ${{ github.workspace }}/target/purrdf-bench
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # SHA-pinned action rather than `curl https://astral.sh/uv/install.sh | sh`,
      # which is what the job ran on the per-push path: an unversioned installer
      # piped into a shell is whatever that URL serves on the day it runs. This is
      # the same pin `release-pypi.yaml` already uses.
      #
      # The three remaining unpinned copies in `ci.yaml` are pre-existing and are
      # deliberately not touched here — this PR moves a job, and rewriting the
      # gating lanes' installer belongs in its own change.
      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0

      # The scale-corpus lane, at the only size a hosted runner can afford:
      # one that keeps nothing. 10^6 rows is ~177 MB of N-Quads, streamed
      # through a digest and dropped — the step retains NOT ONE BYTE, and it
      # must stay that way. Density rises with the entity index space (~177
      # bytes per row at a 10^6-entity space, ~183 at 10^10), so full scale
      # (10^10 rows over a matching 10^10-entity space) is ~1.83 TB — an
      # operator activity off CI, streamed into a consumer; a runner has
      # neither the disk nor the hours for it, and `SCALE_MODE=files` must
      # never appear here.
      #
      # This is a smoke, not a measurement: it proves the generator and its
      # driver still run and still agree on a row count, and says nothing about
      # speed. It runs before the long bench steps so a broken generator is
      # reported in a minute rather than after two hours. The driver exits
      # non-zero if any shard fails (`bench-corpus` exits 2 on a rejected
      # specification and 1 on a write failure), so a failure is a red step
      # rather than a green one with an apology in the log — the red gates
      # nothing (no pull request triggers this workflow), but it is never
      # laundered into green.
      - name: Smoke the scale-corpus lane (streamed, retains nothing)
        run: |
          set -euo pipefail
          SCALE_QUADS=1000000 SCALE_IRIS=100000 SCALE_SHARDS=4 SCALE_MODE=stream \
            bash scripts/scale-corpus.sh

      # This list is the mirror of `make bench`, not its source: local runs are
      # the number source per operator law, and this job is the optional mirror.
      # Crate union = the Makefile's 20 + arrow + n3 + the purrdf umbrella.
      - name: Compile benchmark harnesses
        run: |
          cargo bench -p purrdf-gts --no-run --locked
          cargo bench -p purrdf-columnar --no-run --locked
          cargo bench -p purrdf-json --no-run --locked
          cargo bench -p purrdf-geo-kernel --no-run --locked
          cargo bench -p purrdf-jsonschema --no-run --locked
          cargo bench -p purrdf-arrow --no-run --locked
          cargo bench -p purrdf-n3 --no-run --locked
          cargo bench -p purrdf --no-run --locked
          cargo bench -p purrdf-core --no-run --locked
          cargo bench -p purrdf-rdf --bench native_codecs --no-run --locked
          cargo bench -p purrdf-rdf --bench projections --no-run --locked
          cargo bench -p purrdf-sparql-eval --no-run --locked
          cargo bench -p purrdf-shapes --bench validate --no-run --locked
          cargo bench -p purrdf-entail --no-run --locked
          cargo bench -p purrdf-geo --no-run --locked
          cargo bench -p purrdf-text --bench search --no-run --locked
          cargo bench -p purrdf-wasm --bench query_engine_reuse --no-run --locked
          cargo bench -p purrdf-lex --no-run --locked
          cargo bench -p purrdf-iri --no-run --locked
          cargo bench -p purrdf-xsd --no-run --locked
          cargo bench -p purrdf-sparql-algebra --bench tokenize --no-run --locked
          cargo bench -p purrdf-sparql-results --no-run --locked
          cargo bench -p purrdf-hash-conformance --no-run --locked
          cargo bench -p purrdf-deflate --no-run --locked

      # Same union as the compile step above; the mirror-of-make-bench note lives there.
      - name: Run the native bench suites
        run: |
          cargo bench -p purrdf-gts --locked
          cargo bench -p purrdf-columnar --locked
          cargo bench -p purrdf-json --locked
          cargo bench -p purrdf-geo-kernel --locked
          cargo bench -p purrdf-jsonschema --locked
          cargo bench -p purrdf-arrow --locked
          cargo bench -p purrdf-n3 --locked
          cargo bench -p purrdf --locked
          cargo bench -p purrdf-core --locked
          cargo bench -p purrdf-rdf --bench native_codecs --locked
          cargo bench -p purrdf-rdf --bench projections --locked
          cargo bench -p purrdf-sparql-eval --locked
          cargo bench -p purrdf-shapes --bench validate --locked
          cargo bench -p purrdf-entail --locked
          cargo bench -p purrdf-geo --locked
          cargo bench -p purrdf-text --bench search --locked
          cargo bench -p purrdf-wasm --bench query_engine_reuse --locked
          cargo bench -p purrdf-lex --locked
          cargo bench -p purrdf-iri --locked
          cargo bench -p purrdf-xsd --locked
          cargo bench -p purrdf-sparql-algebra --bench tokenize --locked
          cargo bench -p purrdf-sparql-results --locked
          cargo bench -p purrdf-hash-conformance --locked
          cargo bench -p purrdf-deflate --locked

      - name: Run Python compat harness
        working-directory: bindings/python
        run: |
          uv run maturin develop
          uv run python benchmarks/bench_compat.py --json bench_compat.json

      - name: Upload benchmark artifacts
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: benchmark-results
          path: |
            target/purrdf-bench/
            bindings/python/bench_compat.json
          if-no-files-found: warn

      # The run's estimates records, collected under one per-run name. The store
      # keeps one estimates.json per benchmark at
      # <group>[/<function>[/<parameter>]]/<record>/estimates.json (a record is
      # `new` or a baseline name); the collection preserves that relative
      # layout, because the file names no benchmark — its path is its identity.
      #
      # NOT auto-committed: this workflow only collects and summarizes. The
      # coordinator commits snapshots into docs/benchmarks/<suite>-<date>-<host>/.
      #
      # Fail-closed like the rest of the job: zero records fails the step, so a
      # green run always carries data, and on a red run the step still runs to
      # collect whatever the completed suites produced.
      - name: Collect the estimates records
        if: success() || failure()
        run: |
          set -euo pipefail
          python3 - "$PURRDF_BENCH_HOME" "$GITHUB_WORKSPACE/bench-estimates" \
            "$GITHUB_STEP_SUMMARY" <<'PY'
          """Summarize and stage the run's purrdf_testkit::bench estimates records.

          Stdlib only, and no second estimates parser: the summary reads the
          members the harness's own reader enforces (schema 1 time records in
          `ns`, schema 2 count records in a named count unit) and derives the
          declared throughput from the median.
          """
          import json
          import shutil
          import sys
          from pathlib import Path

          store, staging, summary_path = (Path(arg) for arg in sys.argv[1:4])
          records = sorted(store.glob("**/estimates.json"))
          if not records:
              sys.exit(f"no estimates.json under {store}: a bench run with no records is broken")

          rows = []
          for path in records:
              record = json.loads(path.read_text())
              identity = path.relative_to(store).parent.as_posix()
              unit, median, mad = record["unit"], record["median"], record["mad"]
              lo, hi = record["ci_low"], record["ci_high"]
              rate = ""
              declared = record.get("throughput")
              if declared is not None and median > 0:
                  per_second = declared["per_iteration"] * 1e9 / median
                  rate = (
                      f"{per_second / 2**30:.2f} GiB/s"
                      if declared["kind"] == "bytes"
                      else f"{per_second:.3g} elem/s"
                  )
              rows.append((identity, unit, median, mad, lo, hi, rate))

          width = max(len(row[0]) for row in rows)
          header = (
              f"{'benchmark':<{width}}  {'unit':>18}  {'median':>12}  {'mad':>12}"
              f"  {'95% CI':>24}  throughput"
          )
          print(header)
          for identity, unit, median, mad, lo, hi, rate in rows:
              ci = f"[{lo:.3g}, {hi:.3g}]"
              print(
                  f"{identity:<{width}}  {unit:>18}  {median:>12.3g}  {mad:>12.3g}"
                  f"  {ci:>24}  {rate}"
              )

          with summary_path.open("w") as summary:
              summary.write(f"{len(rows)} estimates records\n\n")
              summary.write("| benchmark | unit | median | mad | 95% CI | throughput |\n")
              summary.write("|---|---|---|---|---|---|\n")
              for identity, unit, median, mad, lo, hi, rate in rows:
                  summary.write(
                      f"| {identity} | {unit} | {median:.4g} | {mad:.4g}"
                      f" | [{lo:.4g}, {hi:.4g}] | {rate} |\n"
                  )

          # The artifact: each record copied whole, relative layout preserved.
          if staging.exists():
              shutil.rmtree(staging)
          staging.mkdir(parents=True)
          for path in records:
              target = staging / path.relative_to(store)
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(path, target)
          print(f"collected {len(rows)} records into {staging}")
          PY

      - name: Upload the estimates collection
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-estimates-${{ github.run_id }}
          path: bench-estimates/
          if-no-files-found: warn

  # THE HEAD AGAINST ITS BASE, ON ONE MACHINE, IN ONE RUN. Two bench runs on two
  # different runners compare two machines as much as two commits; the numbers only
  # mean something when the base and the head are measured back to back on the same
  # host. So each matrix entry builds and runs one bench target on the base commit
  # with `--save-baseline base`, then on the head against that baseline, sharing one
  # benchmark store (PURRDF_BENCH_HOME, `target/purrdf-bench`) so the head run reads
  # exactly the records the base run saved.
  #
  # Every target runs on both architectures the library ships on: `ubuntu-latest`
  # (x86_64) and `ubuntu-24.04-arm` (aarch64). A regression can live on one only --
  # a SIMD kernel, a layout that packs differently, a branch the other predictor
  # hides -- so the matrix is runner x target, and each entry compares within its
  # own runner.
  #
  # Dispatch-only: a scheduled run is on `main`, whose merge-base with `origin/main`
  # is itself. And NOT `continue-on-error` -- this job exists to answer one question
  # ("did this change regress a suite?"), and a red answer that renders as green
  # answers nothing. It gates no merge either way, because nothing on a pull request
  # triggers it.
  #
  # One matrix entry per bench target, not per crate, because every CI job must
  # fit in 30 minutes: one entry is two optimized builds of one bench binary plus two
  # runs of it, and the largest crate carries fourteen suites. The target list is
  # computed by `scripts/bench-suite-targets.py` from the `make bench` crate list,
  # so the population cannot drift from the Makefile, and only purrdf_testkit::bench
  # suites are in it -- the allocation probes are plain `main` functions that do not
  # accept the harness's baseline flags. A target the base commit runs on another
  # harness is marked as having no base, since its records are not this harness's.
  bench-compare-plan:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      base: ${{ steps.base.outputs.sha }}
      targets: ${{ steps.targets.outputs.targets }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      # The input reaches the shell through the environment, never interpolated into
      # the script text, so a ref name is data and not code.
      - name: Resolve the base commit
        id: base
        env:
          BASE_REF: ${{ inputs.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "$BASE_REF" ]; then
            sha="$(git rev-parse --verify --end-of-options "${BASE_REF}^{commit}")"
          else
            sha="$(git merge-base origin/main HEAD)"
          fi
          echo "base commit: $sha (head: $(git rev-parse HEAD))"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: List the bench-harness targets of the head and the base
        id: targets
        env:
          BASE_SHA: ${{ steps.base.outputs.sha }}
        run: |
          set -euo pipefail
          git worktree add --detach ../base "$BASE_SHA"
          targets="$(python3 scripts/bench-suite-targets.py --root . --base-root ../base)"
          echo "$targets"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  bench-compare:
    needs: bench-compare-plan
    name: bench-compare (${{ matrix.runner }} / ${{ matrix.target.crate }} / ${{ matrix.target.bench }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
        target: ${{ fromJSON(needs.bench-compare-plan.outputs.targets) }}
    env:
      # Each tree builds into its own target directory: the two trees contain path
      # crates with the same name and version, and a shared directory lets the head
      # build link against units compiled from the base's sources. Only the benchmark
      # store is shared, through PURRDF_BENCH_HOME, so the head run finds exactly
      # what the base run saved.
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
      PURRDF_BENCH_HOME: ${{ github.workspace }}/target/purrdf-bench
      BASE_SHA: ${{ needs.bench-compare-plan.outputs.base }}
      RUNNER_LABEL: ${{ matrix.runner }}
      CRATE: ${{ matrix.target.crate }}
      BENCH: ${{ matrix.target.bench }}
      IN_BASE: ${{ matrix.target.in_base }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # v1
        with:
          toolchain: "nightly" # keep in sync with rust-toolchain.toml

      - name: Check out the base commit beside the head
        run: git worktree add --detach ../base "$BASE_SHA"

      - name: Record the base commit's baseline
        if: matrix.target.in_base
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/../base-target
        run: |
          set -euo pipefail
          cd ../base
          cargo bench --locked -p "$CRATE" --bench "$BENCH" -- --save-baseline base \
            2>&1 | tee "$GITHUB_WORKSPACE/bench-base.log"

      # `--baseline-lenient` rather than `--baseline`: the strict form fails the run
      # when ONE benchmark in the target has no saved baseline, which is exactly the
      # state of a benchmark function added by the change under test. The lenient form
      # still compares every benchmark the base recorded.
      - name: Measure the head against the base baseline
        run: |
          set -euo pipefail
          if [ "$IN_BASE" = "true" ]; then
            compare=(--baseline-lenient base)
          else
            echo "$CRATE/$BENCH is not a bench-harness suite at $BASE_SHA; recording the head without a comparison"
            compare=()
          fi
          cargo bench --locked -p "$CRATE" --bench "$BENCH" -- "${compare[@]}" \
            2>&1 | tee bench-head.log

      - name: Fail on any regression the harness reports
        run: |
          set -euo pipefail
          if grep -n -B2 'Performance has regressed' bench-head.log; then
            echo "::error::the bench harness reports a regression in $CRATE/$BENCH on $RUNNER_LABEL against $BASE_SHA"
            exit 1
          fi
          echo "no regression reported in $CRATE/$BENCH on $RUNNER_LABEL against $BASE_SHA"

      - name: Upload the comparison
        if: success() || failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bench-compare-${{ matrix.runner }}-${{ matrix.target.crate }}-${{ matrix.target.bench }}
          path: |
            bench-base.log
            bench-head.log
            target/purrdf-bench/
          if-no-files-found: warn
